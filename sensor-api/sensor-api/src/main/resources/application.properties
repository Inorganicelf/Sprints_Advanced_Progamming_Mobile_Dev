# Application Name
spring.application.name=sensor-api

# Server Configuration
server.port=8080
server.servlet.context-path=/

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:sensordb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (para desenvolvimento)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.format-sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# CORS Configuration (adicional)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.max-age=3600

# Logging Configuration
logging.level.com.example.sensor_api=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Management Endpoints (Actuator)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Custom Application Properties
app.name=Sensor API - Digital Twin Platform
app.version=1.0.0
app.description=API para gerenciamento de sensores pneumáticos

# Configurações existentes do projeto

# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGeneration123456789
jwt.expiration=86400

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
